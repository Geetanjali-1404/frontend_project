services:
  - type: web
    name: gobeyond-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        value: rzp_test_GoBeyondDemo2026
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_secret_GoBeyond2026
      - key: GEMINI_API_KEY
        sync: false
